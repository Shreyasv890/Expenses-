<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense ledger</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f766e"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#14201c;--mut:#62736c;--line:#dde5e2;--ac:#0f766e;--cell:#eaf0ee;--bad:#c2410c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#16201d;--ink:#e8f0ed;--mut:#8aa098;--line:#25322e;--ac:#2dd4bf;--cell:#1d2a26;--bad:#fb923c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#16201d;--ink:#e8f0ed;--mut:#8aa098;--line:#25322e;--ac:#2dd4bf;--cell:#1d2a26;--bad:#fb923c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.yr{display:flex;align-items:center;gap:4px}
.yr button{width:34px;height:34px;border-radius:10px;background:var(--cell);font-size:16px}
.yr b{min-width:48px;text-align:center;font-size:17px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--cell);color:var(--mut)}
.chip.ok{color:var(--ac)}.chip.err{color:var(--bad)}
#ms{display:flex;gap:6px;overflow-x:auto;position:relative;padding:2px 0 10px;scrollbar-width:none}
#ms button{flex:none;padding:7px 13px;border-radius:99px;background:var(--cell);color:var(--mut);font-weight:500}
#ms button.on{background:var(--ac);color:var(--bg);font-weight:600}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bar{height:8px;border-radius:9px;background:var(--cell);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bar.over i{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{text-align:center;font-size:12px;color:var(--mut);padding-bottom:2px}
.d{position:relative;aspect-ratio:1/1.05;border-radius:10px;background:var(--cell);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;overflow:hidden;font-weight:500}
.d small{font-size:10px;color:var(--mut);margin-top:1px}
.d i{position:absolute;left:0;bottom:0;height:4px;background:var(--ac)}
.d.has{background:color-mix(in srgb,var(--ac) 14%,var(--cell))}
.d.today{box-shadow:inset 0 0 0 1.5px var(--ac)}
.d.sel{background:var(--ac);color:var(--bg)}
.d.sel small{color:var(--bg)}.d.sel i{background:var(--bg)}
.d.off{background:none;pointer-events:none}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
form .w{grid-column:1/-1}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.btn{background:var(--ac);color:var(--bg);font-weight:600;padding:12px;border-radius:12px;width:100%}
.btn.ghost{background:var(--cell);color:var(--ink)}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.it .t{flex:1;min-width:0}.it .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.x{color:var(--mut);padding:6px 8px;border-radius:8px;font-size:13px}
.x.arm{color:var(--bad);font-weight:600}
.seg{display:flex;height:10px;border-radius:9px;overflow:hidden;margin-bottom:10px;background:var(--cell)}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0}.lg span:nth-child(2){flex:1}
.ym{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;width:100%;padding:6px 0;text-align:left}
.ym.on .n{color:var(--ac);font-weight:700}
details summary{cursor:pointer;font-weight:600;list-style:none}
details .in{padding-top:12px;display:grid;gap:10px}
.empty{color:var(--mut);padding:8px 0}
.cr{width:100%;text-align:left;padding:8px 0}
.cr small{margin-left:4px}
.ci{display:grid;grid-template-columns:54px 1fr auto;gap:8px;padding:7px 0 7px 18px;border-top:1px dashed var(--line);font-size:14px}
.lg input{flex:1;width:auto;min-width:0;padding:8px 10px}
.ec{width:auto;padding:2px 6px;font-size:13px;color:var(--mut);border-radius:8px;margin-top:2px}
</style>
</head>
<body>
<main>
  <div class="row" style="margin-bottom:12px">
    <div class="yr"><button data-a="py" aria-label="Previous year">‹</button><b id="yl"></b><button data-a="ny" aria-label="Next year">›</button></div>
    <span id="st" class="chip">Loading…</span>
  </div>
  <section class="card" id="acc" hidden></section>
  <div id="ms"></div>
  <section class="card" id="sum"></section>
  <section class="card"><div class="cal" id="cal"></div></section>
  <section class="card" id="day"></section>
  <section class="card" id="cat"></section>
  <section class="card" id="year"></section>
  <section class="card">
    <details><summary>Settings and backup</summary>
      <div class="in">
        <label class="mut">Monthly limit<input id="lim" type="number" inputmode="decimal" min="0"></label>
        <label class="mut">Currency<select id="cur"><option>₹</option><option>$</option><option>€</option><option>£</option></select></label>
        <div style="display:flex;gap:8px"><input id="nc" placeholder="New category, e.g. Pet care"><button class="btn ghost" style="width:auto;padding:0 16px" data-a="addcat">Add</button></div>
        <span class="mut">Rename or delete categories (past entries update too)</span><div id="cl"></div>
        <button class="btn ghost" data-a="csv">Download all entries (CSV)</button>
        <button class="btn ghost" data-a="bak">Back up all data (JSON)</button>
        <button class="btn ghost" data-a="rst">Restore from backup</button>
        <input id="rf" type="file" accept=".json,application/json" hidden>
        <p class="mut" style="margin:0">Entries are saved on this phone the moment you add them, and nothing is cleared when a month or year ends. Back up now and then, especially before clearing browser data or changing phones.</p>
      </div>
    </details>
  </section>
</main>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COL=['#e4572e','#3b82f6','#f59e0b','#14a38b','#a855f7','#ec4899','#64748b','#84cc16','#06b6d4','#f97316'];
const p2=n=>String(n).padStart(2,'0');
const now=new Date();
const todayS=`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}`;
let S={months:{},set:{cur:'₹',limit:30000,cats:['Food','Transport','Shopping','Bills','Health','Entertainment','Other']}};
let V={y:now.getFullYear(),m:now.getMonth(),d:todayS};
const OC=new Set();
let db=null,uid=null,armed=null,q=Promise.resolve();
const LS='expense-ledger-v1';
try{const x=JSON.parse(localStorage.getItem(LS));if(x&&x.months)S={months:x.months,set:{...S.set,...x.set}}}catch(e){}
const mk=(y,m)=>`${y}-${p2(m+1)}`;
const ents=k=>S.months[k]||[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>S.set.cur+(Math.round(n*100)/100).toLocaleString(S.set.cur==='₹'?'en-IN':'en-US',{maximumFractionDigits:2});
const sum=a=>a.reduce((t,e)=>t+e.a,0);
const ci=c=>{const i=S.set.cats.indexOf(c);return COL[(i<0?S.set.cats.length:i)%COL.length]};

function status(k){const e=$('#st');e.className='chip'+(k==='saved'?' ok':k==='err'?' err':'');
  e.textContent={saved:'Synced with family',local:'Saved on this phone',err:'Could not save: storage full',busy:'Saving…'}[k]||''}
let FS=null,unsub=null,first=true;
const WHO=()=>localStorage.getItem('who')||'';
const ref=k=>FS.collection('families').doc(uid).collection('data').doc(k);
function w(f){status('busy');q=q.then(f).then(()=>status('saved'),()=>status('err'))}
function persist(key){let ok=1;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){ok=0;status('err')}
  if(!FS){if(ok)status('local');return}
  if(key)w(()=>ref(key).set(key==='settings'?{...S.set}:{entries:ents(key.slice(2))}))}
function addE(k,en){persist();if(FS)w(()=>ref('m-'+k).set({entries:firebase.firestore.FieldValue.arrayUnion(en)},{merge:true}))}
function delE(k,en){persist();if(FS&&en)w(()=>ref('m-'+k).set({entries:firebase.firestore.FieldValue.arrayRemove(en)},{merge:true}))}
function pushAll(){persist();Object.keys(S.months).forEach(k=>persist('m-'+k));persist('settings')}
function onData(snap){
  const months={};let set={...S.set};
  snap.forEach(d=>{const v=d.data()||{};if(d.id==='settings')set={...set,...v};else if(d.id.startsWith('m-'))months[d.id.slice(2)]=v.entries||[]});
  const f=first;first=false;
  if(f){for(const k in S.months){const have=new Set((months[k]||[]).map(e=>e.id));S.months[k].filter(e=>!have.has(e.id)).forEach(e=>{(months[k]=months[k]||[]).push(e);addE(k,e)})}
    set.cats=[...new Set([...(set.cats||[]),...S.set.cats])]}
  S={months,set};try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(f)persist('settings');
  if(!/INPUT|SELECT/.test(document.activeElement.tagName))render();
}
function acc(u){const e=$('#acc');e.hidden=false;
  e.innerHTML=u?`<div class="row"><b>Family ledger</b><button class="x" data-a="gout">Sign out</button></div><div class="mut" style="margin:4px 0 8px">Shared with everyone signed in as ${esc(u.email)}</div><input id="who" placeholder="Your name, e.g. Amma" value="${esc(WHO())}">`:`<b>Share with your family</b><p class="mut" style="margin:4px 0 10px">Sign in with Google. Everyone using the same Google account sees and adds to the same ledger.</p><button class="btn" data-a="gin">Sign in with Google</button>`}
function signIn(){const a=firebase.auth(),p=new firebase.auth.GoogleAuthProvider();a.signInWithPopup(p).catch(e=>{if(e.code!=='auth/popup-closed-by-user')a.signInWithRedirect(p)})}
function initFb(){
  const c=window.FB_CONFIG;
  if(!c||!c.apiKey||/^PASTE/.test(c.apiKey)||typeof firebase==='undefined')return;
  firebase.initializeApp(c);const fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    acc(u);
    if(u){uid=u.uid;FS=fs;first=true;unsub=FS.collection('families').doc(uid).collection('data').onSnapshot(onData,()=>status('err'))}
    else{FS=null;status('local')}
  });
}
function save(n,d,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function restore(f){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.months)throw 0;for(const k in x.months){const have=new Set(ents(k).map(e=>e.id));S.months[k]=[...ents(k),...x.months[k].filter(e=>!have.has(e.id))]}(x.set&&x.set.cats||[]).forEach(c=>{if(!S.set.cats.includes(c))S.set.cats.push(c)});pushAll();render();alert('Backup restored.')}catch(e){alert('That file is not an expense backup.')}};r.readAsText(f)}
function render(){
  const {y,m}=V,k=mk(y,m),E=ents(k),lim=+S.set.limit||0,tot=sum(E);
  $('#yl').textContent=y;
  $('#ms').innerHTML=MN.map((n,i)=>`<button data-m="${i}" class="${i===m?'on':''}">${n}</button>`).join('');
  const c=$('#ms'),b=c.querySelector('.on');c.scrollLeft=b.offsetLeft-c.clientWidth/2+b.clientWidth/2;
  const dim=new Date(y,m+1,0).getDate(),by={};E.forEach(e=>by[e.d]=(by[e.d]||0)+e.a);
  const days=Object.keys(by),top=days.reduce((a,d)=>Math.max(a,by[d]),0);
  const isNow=y===now.getFullYear()&&m===now.getMonth(),div=isNow?now.getDate():dim;
  const pct=lim?Math.min(100,tot/lim*100):0;
  $('#sum').innerHTML=`<div class="mut">${MN[m]} ${y} spending</div><div class="big">${fmt(tot)}</div>`+
   (lim?`<div class="bar ${tot>lim?'over':''}"><i style="width:${pct}%"></i></div><div class="mut">${Math.round(tot/lim*100)}% of ${fmt(lim)} limit${tot>lim?' · over by '+fmt(tot-lim):''}</div>`:'')+
   `<div class="stats"><div><span class="mut">Entries</span><b>${E.length}</b></div><div><span class="mut">Highest day</span><b>${fmt(top)}</b></div><div><span class="mut">Daily average</span><b>${fmt(tot/div)}</b></div></div>`;
  const first=new Date(y,m,1).getDay();
  let h=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div class="d off"></div>'.repeat(first);
  for(let i=1;i<=dim;i++){const ds=`${k}-${p2(i)}`,v=by[ds]||0;
    h+=`<button class="d${v?' has':''}${ds===todayS?' today':''}${ds===V.d?' sel':''}" data-d="${ds}">${i}${v?`<small>${v>=10000?Math.round(v/1000)+'k':Math.round(v)}</small><i style="width:${Math.max(8,v/top*100)}%"></i>`:''}</button>`}
  $('#cal').innerHTML=h;
  if(!V.d.startsWith(k)){V.d=`${k}-01`;}
  const dl=E.filter(e=>e.d===V.d),[dy,dm,dd]=V.d.split('-');
  $('#day').innerHTML=`<div class="row"><h2>${+dd} ${MN[dm-1]} ${dy}</h2><b>${fmt(sum(dl))}</b></div>
   <form id="f"><input id="am" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Amount" required><select id="ct">${S.set.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
   <input class="w" id="nt" placeholder="What was it for? e.g. Electric bill"><button class="btn w">Add expense</button></form>`+
   (dl.length?dl.map(e=>`<div class="it"><span class="dot" style="background:${ci(e.c)}"></span><div class="t"><div>${esc(e.n||e.c)}${e.u?` <span class="mut">· ${esc(e.u)}</span>`:''}</div><select class="ec" data-ec="${e.id}">${[...new Set([...S.set.cats,e.c])].map(c=>`<option${c===e.c?' selected':''}>${esc(c)}</option>`).join('')}</select></div><b>${fmt(e.a)}</b><button class="x${armed===e.id?' arm':''}" data-x="${e.id}">${armed===e.id?'Delete?':'Remove'}</button></div>`).join(''):'<div class="empty">No expenses on this day yet.</div>');
  const cs={};E.forEach(e=>cs[e.c]=(cs[e.c]||0)+e.a);const ck=Object.keys(cs).sort((a,b)=>cs[b]-cs[a]);
  $('#cat').innerHTML=`<h2>By category</h2>`+(ck.length?`<div class="seg">${ck.map(c=>`<i style="width:${cs[c]/tot*100}%;background:${ci(c)}"></i>`).join('')}</div>`+ck.map(c=>`<button class="lg cr" data-cc="${esc(c)}"><span class="dot" style="background:${ci(c)}"></span><span>${esc(c)} <small class="mut">${(n=>n+(n===1?' item':' items'))(E.filter(e=>e.c===c).length)} ${OC.has(c)?'▴':'▾'}</small></span><b>${fmt(cs[c])}</b></button>${OC.has(c)?E.filter(e=>e.c===c).sort((a,b)=>a.d<b.d?1:-1).map(e=>`<div class="ci"><span class="mut">${+e.d.slice(8)} ${MN[+e.d.slice(5,7)-1]}</span><span>${esc(e.n||e.c)}${e.u?` · ${esc(e.u)}`:''}</span><b>${fmt(e.a)}</b></div>`).join(''):''}`).join(''):'<div class="empty">Add an expense to see where the money goes.</div>');
  const mt=MN.map((_,i)=>sum(ents(mk(y,i)))),mx=Math.max(...mt,1),yt=mt.reduce((a,b)=>a+b,0);
  $('#year').innerHTML=`<div class="row"><h2>${y} month by month</h2><b>${fmt(yt)}</b></div>`+MN.map((n,i)=>`<button class="ym${i===m?' on':''}" data-m="${i}"><span class="n">${n}</span><div class="bar" style="margin:0"><i style="width:${mt[i]/mx*100}%"></i></div><span>${fmt(mt[i])}</span></button>`).join('');
  $('#cl').innerHTML=S.set.cats.map((c,i)=>`<div class="lg"><span class="dot" style="background:${ci(c)}"></span><input data-cat="${i}" value="${esc(c)}" aria-label="Category name"><button class="x${armed==='c'+i?' arm':''}" data-dc="${i}">${armed==='c'+i?'Delete?':'Delete'}</button></div>`).join('');$('#lim').value=lim||'';$('#cur').value=S.set.cur;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const D=t.dataset;
  if(D.a==='py'||D.a==='ny'){V.y+=D.a==='py'?-1:1;V.d=mk(V.y,V.m)+'-01';render()}
  else if(D.m!==undefined){V.m=+D.m;V.d=mk(V.y,V.m)+'-01';render()}
  else if(D.d){V.d=D.d;render()}
  else if(D.x){
    if(armed!==D.x){armed=D.x;setTimeout(()=>{if(armed===D.x){armed=null;render()}},3000);render();return}
    const k=V.d.slice(0,7);const gone=ents(k).find(x=>x.id===D.x);S.months[k]=ents(k).filter(x=>x.id!==D.x);armed=null;delE(k,gone);render()}
  else if(D.cc!==undefined){OC.has(D.cc)?OC.delete(D.cc):OC.add(D.cc);render()}
  else if(D.dc!==undefined){const i=+D.dc,old=S.set.cats[i];
    if(armed!=='c'+i){armed='c'+i;setTimeout(()=>{if(armed==='c'+i){armed=null;render()}},3000);render();return}
    armed=null;if(S.set.cats.length<2){render();return}
    S.set.cats.splice(i,1);const fb=S.set.cats.includes('Other')?'Other':S.set.cats[0];
    Object.keys(S.months).forEach(k=>{if(ents(k).some(x=>x.c===old)){S.months[k]=ents(k).map(x=>x.c===old?{...x,c:fb}:x);persist('m-'+k)}});
    persist('settings');render()}
  else if(D.a==='addcat'){const v=$('#nc').value.trim();if(v&&!S.set.cats.includes(v)){S.set.cats.push(v);persist('settings')}$('#nc').value='';render()}
  else if(D.a==='gin')signIn();
  else if(D.a==='gout')firebase.auth().signOut();
  else if(D.a==='csv')exportCsv();
  else if(D.a==='bak')save('expense-backup-'+todayS+'.json',JSON.stringify(S),'application/json');
  else if(D.a==='rst')$('#rf').click();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const a=parseFloat($('#am').value);if(!(a>0))return;
  const k=V.d.slice(0,7);
  const en={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),d:V.d,a,c:$('#ct').value,n:$('#nt').value.trim(),u:WHO()};S.months[k]=[...ents(k),en];addE(k,en);render();
});
$('#lim').addEventListener('change',e=>{S.set.limit=Math.max(0,+e.target.value||0);persist('settings');render()});
$('#cur').addEventListener('change',e=>{S.set.cur=e.target.value;persist('settings');render()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='who')localStorage.setItem('who',t.value.trim());
  else if(t.dataset.ec){const k=V.d.slice(0,7);S.months[k]=ents(k).map(x=>x.id===t.dataset.ec?{...x,c:t.value}:x);persist('m-'+k);render()}
  else if(t.dataset.cat!==undefined){const i=+t.dataset.cat,old=S.set.cats[i],nv=t.value.trim();
    if(!nv||nv===old||S.set.cats.includes(nv)){t.value=old;return}
    S.set.cats[i]=nv;
    Object.keys(S.months).forEach(k=>{if(ents(k).some(x=>x.c===old)){S.months[k]=ents(k).map(x=>x.c===old?{...x,c:nv}:x);persist('m-'+k)}});
    persist('settings');render()}});
async function exportCsv(){
  const rows=[['Date','Category','Amount','Note']];
  Object.keys(S.months).sort().forEach(k=>ents(k).slice().sort((a,b)=>a.d<b.d?-1:1).forEach(e=>rows.push([e.d,e.c,e.a,e.n||''])));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  save('expenses.csv',csv,'text/csv')
}
$('#rf').addEventListener('change',e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''});
window.addEventListener('load',initFb);
status('local');render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
